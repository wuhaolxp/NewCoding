<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surf Game - Edge Style</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a1628;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  #gameCanvas {
    display: block;
    background: #1a3a5c;
    border-radius: 4px;
  }
  #startScreen, #gameOverScreen {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #fff;
    z-index: 10;
    background: rgba(10, 22, 40, 0.92);
  }
  #gameOverScreen { display: none; }
  .title {
    font-size: 64px;
    font-weight: 800;
    letter-spacing: 4px;
    margin-bottom: 10px;
    text-shadow: 0 4px 20px rgba(0,150,255,0.5);
    background: linear-gradient(135deg, #00d4ff, #0088ff, #00ffcc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    font-size: 18px;
    color: #8ab4d8;
    margin-bottom: 40px;
  }
  .btn {
    padding: 14px 48px;
    font-size: 20px;
    font-weight: 700;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    background: linear-gradient(135deg, #0088ff, #00ccff);
    color: #fff;
    letter-spacing: 1px;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 20px rgba(0,136,255,0.4);
  }
  .btn:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 30px rgba(0,136,255,0.6);
  }
  .controls-info {
    margin-top: 30px;
    color: #6a9ec0;
    font-size: 14px;
    text-align: center;
    line-height: 1.8;
  }
  .score-final {
    font-size: 48px;
    font-weight: 800;
    color: #00d4ff;
    margin: 10px 0 30px;
  }
  .high-score {
    font-size: 16px;
    color: #8ab4d8;
    margin-bottom: 20px;
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="startScreen">
  <div class="title">SURF</div>
  <div class="subtitle">Ride the waves. Dodge the obstacles.</div>
  <button class="btn" onclick="startGame()">START</button>
  <div class="controls-info">
    Arrow Keys / A,D to move<br>
    Space to start/restart<br>
    Touch: swipe or tap sides
  </div>
</div>

<div id="gameOverScreen">
  <div class="title" style="font-size:48px">WIPEOUT!</div>
  <div class="subtitle">Your Score</div>
  <div class="score-final" id="finalScore">0</div>
  <div class="high-score" id="highScoreText">Best: 0</div>
  <button class="btn" onclick="startGame()">PLAY AGAIN</button>
</div>

<script>
// ============================================================
// GAME SETUP
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = Math.min(window.innerWidth, 500);
  H = canvas.height = Math.min(window.innerHeight, 800);
}
resize();
window.addEventListener('resize', resize);

// ============================================================
// GAME STATE
// ============================================================
let game = {
  running: false,
  speed: 4,
  maxSpeed: 14,
  acceleration: 0.003,
  score: 0,
  highScore: parseInt(localStorage.getItem('surfHighScore') || '0'),
  lives: 3,
  invincible: 0,
  shielded: false,
  shieldTimer: 0,
  speedBoost: 0,
  distance: 0,
  frame: 0,
};

let player = {
  x: 0,
  y: 0,
  w: 36,
  h: 60,
  targetX: 0,
  vx: 0,
  tilt: 0,
  trail: [],
};

let obstacles = [];
let collectibles = [];
let particles = [];
let waveOffset = 0;
let waterLines = [];

// Initialize water lines
for (let i = 0; i < 30; i++) {
  waterLines.push({
    y: Math.random() * H,
    speed: 0.5 + Math.random() * 1.5,
    width: 30 + Math.random() * 80,
    x: Math.random() * W,
    alpha: 0.05 + Math.random() * 0.1,
  });
}

// Keys
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' && !game.running) startGame();
});
document.addEventListener('keyup', e => keys[e.key] = false);

// Touch
let touchStartX = 0;
let touchCurrentX = 0;
let touching = false;

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  touchStartX = e.touches[0].clientX;
  touchCurrentX = touchStartX;
  touching = true;
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  touchCurrentX = e.touches[0].clientX;
});
canvas.addEventListener('touchend', e => {
  touching = false;
});

// ============================================================
// OBSTACLE & COLLECTIBLE TYPES
// ============================================================
const OBSTACLE_TYPES = [
  { type: 'rock', w: 40, h: 35, color: '#5a6a7a', draw: drawRock },
  { type: 'island', w: 70, h: 50, color: '#3a8a4a', draw: drawIsland },
  { type: 'buoy', w: 24, h: 24, color: '#ff4444', draw: drawBuoy },
  { type: 'log', w: 60, h: 18, color: '#8B6914', draw: drawLog },
  { type: 'iceberg', w: 50, h: 45, color: '#c8e8ff', draw: drawIceberg },
];

const COLLECT_TYPES = [
  { type: 'heart', w: 22, h: 22, color: '#ff4466', draw: drawHeart },
  { type: 'bolt', w: 20, h: 24, color: '#ffdd00', draw: drawBolt },
  { type: 'shield', w: 24, h: 24, color: '#00ccff', draw: drawShield },
  { type: 'star', w: 20, h: 20, color: '#ffaa00', draw: drawStar },
];

// ============================================================
// START / RESET
// ============================================================
function startGame() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameOverScreen').style.display = 'none';
  
  game.running = true;
  game.speed = 4;
  game.score = 0;
  game.lives = 3;
  game.invincible = 0;
  game.shielded = false;
  game.shieldTimer = 0;
  game.speedBoost = 0;
  game.distance = 0;
  game.frame = 0;
  
  player.x = W / 2;
  player.y = H * 0.75;
  player.targetX = W / 2;
  player.vx = 0;
  player.tilt = 0;
  player.trail = [];
  
  obstacles = [];
  collectibles = [];
  particles = [];
  
  requestAnimationFrame(loop);
}

// ============================================================
// SPAWN
// ============================================================
let spawnTimer = 0;
let collectTimer = 0;

function spawnObstacle() {
  const type = OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)];
  const margin = 40;
  obstacles.push({
    ...type,
    x: margin + Math.random() * (W - margin * 2),
    y: -60,
    rot: Math.random() * 0.3 - 0.15,
  });
}

function spawnCollectible() {
  const type = COLLECT_TYPES[Math.floor(Math.random() * COLLECT_TYPES.length)];
  const margin = 40;
  collectibles.push({
    ...type,
    x: margin + Math.random() * (W - margin * 2),
    y: -40,
    bobPhase: Math.random() * Math.PI * 2,
  });
}

// ============================================================
// UPDATE
// ============================================================
function update() {
  game.frame++;
  const spd = game.speed + (game.speedBoost > 0 ? 3 : 0);
  
  // Increase speed
  if (game.speed < game.maxSpeed) {
    game.speed += game.acceleration;
  }
  
  // Score
  game.distance += spd;
  game.score = Math.floor(game.distance / 10);
  
  // Timers
  if (game.invincible > 0) game.invincible--;
  if (game.shieldTimer > 0) {
    game.shieldTimer--;
    if (game.shieldTimer <= 0) game.shielded = false;
  }
  if (game.speedBoost > 0) game.speedBoost--;
  
  // Player movement
  const moveSpeed = 6;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
    player.vx -= moveSpeed * 0.3;
  }
  if (keys['ArrowRight'] || keys['d'] || keys['D']) {
    player.vx += moveSpeed * 0.3;
  }
  
  // Touch movement
  if (touching) {
    const diff = touchCurrentX - (canvas.getBoundingClientRect().left + player.x);
    player.vx += diff * 0.02;
  }
  
  player.vx *= 0.88;
  player.x += player.vx;
  player.tilt = player.vx * 0.05;
  
  // Boundaries
  const margin = player.w / 2 + 10;
  if (player.x < margin) { player.x = margin; player.vx = 0; }
  if (player.x > W - margin) { player.x = W - margin; player.vx = 0; }
  
  // Trail
  player.trail.unshift({ x: player.x, y: player.y + player.h / 2 });
  if (player.trail.length > 20) player.trail.pop();
  
  // Spawn obstacles
  spawnTimer += spd * 0.1;
  const spawnRate = Math.max(8, 25 - game.speed);
  if (spawnTimer > spawnRate) {
    spawnTimer = 0;
    spawnObstacle();
    // Sometimes spawn multiple
    if (Math.random() < 0.3 && game.speed > 6) spawnObstacle();
  }
  
  // Spawn collectibles
  collectTimer += spd * 0.05;
  if (collectTimer > 30) {
    collectTimer = 0;
    if (Math.random() < 0.5) spawnCollectible();
  }
  
  // Update obstacles
  for (let i = obstacles.length - 1; i >= 0; i--) {
    obstacles[i].y += spd;
    if (obstacles[i].y > H + 80) {
      obstacles.splice(i, 1);
      continue;
    }
    
    // Collision
    if (game.invincible <= 0 && checkCollision(player, obstacles[i])) {
      if (game.shielded) {
        game.shielded = false;
        game.shieldTimer = 0;
        game.invincible = 60;
        spawnHitParticles(obstacles[i].x, obstacles[i].y, '#00ccff');
        obstacles.splice(i, 1);
      } else {
        game.lives--;
        game.invincible = 90;
        spawnHitParticles(obstacles[i].x, obstacles[i].y, '#ff4444');
        obstacles.splice(i, 1);
        if (game.lives <= 0) {
          gameOver();
          return;
        }
      }
    }
  }
  
  // Update collectibles
  for (let i = collectibles.length - 1; i >= 0; i--) {
    collectibles[i].y += spd;
    collectibles[i].bobPhase += 0.08;
    if (collectibles[i].y > H + 40) {
      collectibles.splice(i, 1);
      continue;
    }
    
    if (checkCollision(player, collectibles[i])) {
      const c = collectibles[i];
      spawnHitParticles(c.x, c.y, c.color);
      
      if (c.type === 'heart') {
        if (game.lives < 5) game.lives++;
      } else if (c.type === 'bolt') {
        game.speedBoost = 180;
      } else if (c.type === 'shield') {
        game.shielded = true;
        game.shieldTimer = 600;
      } else if (c.type === 'star') {
        game.score += 50;
      }
      
      collectibles.splice(i, 1);
    }
  }
  
  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    p.vy += 0.05;
    if (p.life <= 0) particles.splice(i, 1);
  }
  
  // Water
  waveOffset += spd * 0.5;
  for (const wl of waterLines) {
    wl.y += wl.speed * spd * 0.5;
    if (wl.y > H + 10) {
      wl.y = -10;
      wl.x = Math.random() * W;
      wl.width = 30 + Math.random() * 80;
    }
  }
}

function checkCollision(a, b) {
  const shrink = 0.6;
  const aw = a.w * shrink, ah = a.h * shrink;
  const bw = b.w * shrink, bh = b.h * shrink;
  return Math.abs(a.x - b.x) < (aw + bw) / 2 &&
         Math.abs(a.y - b.y) < (ah + bh) / 2;
}

function spawnHitParticles(x, y, color) {
  for (let i = 0; i < 12; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1,
      life: 20 + Math.random() * 20,
      maxLife: 40,
      color,
      size: 2 + Math.random() * 4,
    });
  }
}

function gameOver() {
  game.running = false;
  if (game.score > game.highScore) {
    game.highScore = game.score;
    localStorage.setItem('surfHighScore', game.highScore.toString());
  }
  document.getElementById('finalScore').textContent = game.score;
  document.getElementById('highScoreText').textContent = 'Best: ' + game.highScore;
  document.getElementById('gameOverScreen').style.display = 'flex';
}

// ============================================================
// DRAW
// ============================================================
function draw() {
  // Background gradient (water)
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0d2847');
  grad.addColorStop(0.5, '#1a4a7a');
  grad.addColorStop(1, '#0d3a6a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  
  // Animated wave pattern
  drawWaterEffect();
  
  // Water lines
  for (const wl of waterLines) {
    ctx.globalAlpha = wl.alpha;
    ctx.strokeStyle = '#4a9ad8';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(wl.x - wl.width / 2, wl.y);
    ctx.lineTo(wl.x + wl.width / 2, wl.y);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  
  // Lane markers (subtle)
  drawLaneMarkers();
  
  // Trail (wake)
  drawWake();
  
  // Obstacles
  for (const obs of obstacles) {
    ctx.save();
    ctx.translate(obs.x, obs.y);
    ctx.rotate(obs.rot || 0);
    obs.draw(obs);
    ctx.restore();
  }
  
  // Collectibles
  for (const col of collectibles) {
    ctx.save();
    const bob = Math.sin(col.bobPhase) * 3;
    ctx.translate(col.x, col.y + bob);
    
    // Glow
    ctx.shadowColor = col.color;
    ctx.shadowBlur = 12;
    col.draw(col);
    ctx.shadowBlur = 0;
    ctx.restore();
  }
  
  // Player
  drawPlayer();
  
  // Particles
  for (const p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (p.life / p.maxLife), 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  
  // HUD
  drawHUD();
  
  // Speed boost effect
  if (game.speedBoost > 0) {
    ctx.save();
    ctx.globalAlpha = 0.1 + Math.sin(game.frame * 0.2) * 0.05;
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, 'transparent');
    bg.addColorStop(1, '#ffdd00');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
}

function drawWaterEffect() {
  const time = game.frame * 0.02;
  ctx.globalAlpha = 0.03;
  ctx.fillStyle = '#4ac0ff';
  
  for (let y = 0; y < H; y += 20) {
    const waveY = y + waveOffset % 20;
    if (waveY > H) continue;
    for (let x = 0; x < W; x += 40) {
      const offset = Math.sin(x * 0.02 + time + y * 0.01) * 15;
      ctx.fillRect(x + offset, waveY, 20, 2);
    }
  }
  ctx.globalAlpha = 1;
}

function drawLaneMarkers() {
  ctx.globalAlpha = 0.04;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1;
  ctx.setLineDash([10, 20]);
  
  // Side boundaries
  ctx.beginPath();
  ctx.moveTo(30, 0);
  ctx.lineTo(30, H);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(W - 30, 0);
  ctx.lineTo(W - 30, H);
  ctx.stroke();
  
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
}

function drawWake() {
  if (player.trail.length < 2) return;
  
  for (let i = 0; i < player.trail.length - 1; i++) {
    const t = player.trail[i];
    const alpha = (1 - i / player.trail.length) * 0.3;
    const width = (1 - i / player.trail.length) * 12;
    
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(t.x - width, t.y + i * 2);
    ctx.lineTo(t.x - width - 3, t.y + i * 2 + 4);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(t.x + width, t.y + i * 2);
    ctx.lineTo(t.x + width + 3, t.y + i * 2 + 4);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawPlayer() {
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.tilt);
  
  // Invincibility flash
  if (game.invincible > 0 && Math.floor(game.invincible / 4) % 2 === 0) {
    ctx.globalAlpha = 0.4;
  }
  
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(2, 4, player.w / 2 + 2, player.h / 4, 0, 0, Math.PI * 2);
  ctx.fill();
  
  // Surfboard
  ctx.fillStyle = '#f0f0f0';
  ctx.beginPath();
  ctx.ellipse(0, 8, 10, 28, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#00aaff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, -18);
  ctx.lineTo(0, 32);
  ctx.stroke();
  
  // Surfer body
  ctx.fillStyle = '#1a1a2e';
  // Legs
  ctx.fillRect(-6, 4, 5, 14);
  ctx.fillRect(1, 4, 5, 14);
  
  // Torso
  ctx.fillStyle = '#0066cc';
  ctx.beginPath();
  ctx.roundRect(-8, -12, 16, 18, 3);
  ctx.fill();
  
  // Arms
  ctx.strokeStyle = '#ffcc99';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  // Left arm
  ctx.beginPath();
  ctx.moveTo(-8, -6);
  ctx.lineTo(-16, -2 + Math.sin(game.frame * 0.1) * 2);
  ctx.stroke();
  // Right arm
  ctx.beginPath();
  ctx.moveTo(8, -6);
  ctx.lineTo(16, -2 + Math.sin(game.frame * 0.1 + 1) * 2);
  ctx.stroke();
  
  // Head
  ctx.fillStyle = '#ffcc99';
  ctx.beginPath();
  ctx.arc(0, -18, 7, 0, Math.PI * 2);
  ctx.fill();
  
  // Hair
  ctx.fillStyle = '#2a1a0a';
  ctx.beginPath();
  ctx.arc(0, -20, 7, Math.PI, Math.PI * 2);
  ctx.fill();
  
  // Shield effect
  if (game.shielded) {
    ctx.strokeStyle = '#00ccff';
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.4 + Math.sin(game.frame * 0.1) * 0.2;
    ctx.beginPath();
    ctx.ellipse(0, 0, player.w / 2 + 8, player.h / 2 + 8, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  
  ctx.restore();
}

// ============================================================
// DRAW OBSTACLE SHAPES
// ============================================================
function drawRock(o) {
  ctx.fillStyle = '#5a6a7a';
  ctx.beginPath();
  ctx.moveTo(-o.w/2, 5);
  ctx.lineTo(-o.w/3, -o.h/2);
  ctx.lineTo(o.w/4, -o.h/2 + 3);
  ctx.lineTo(o.w/2, 0);
  ctx.lineTo(o.w/3, o.h/3);
  ctx.lineTo(-o.w/4, o.h/3);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#7a8a9a';
  ctx.beginPath();
  ctx.moveTo(-o.w/4, -o.h/3);
  ctx.lineTo(0, -o.h/2 + 5);
  ctx.lineTo(o.w/5, -o.h/4);
  ctx.closePath();
  ctx.fill();
}

function drawIsland(o) {
  // Water ring
  ctx.fillStyle = 'rgba(100,200,255,0.15)';
  ctx.beginPath();
  ctx.ellipse(0, 5, o.w/2 + 8, o.h/2 + 4, 0, 0, Math.PI * 2);
  ctx.fill();
  // Sand
  ctx.fillStyle = '#e8d5a0';
  ctx.beginPath();
  ctx.ellipse(0, 0, o.w/2, o.h/2 - 5, 0, 0, Math.PI * 2);
  ctx.fill();
  // Green
  ctx.fillStyle = '#3a8a4a';
  ctx.beginPath();
  ctx.ellipse(-5, -3, o.w/3, o.h/3, 0, 0, Math.PI * 2);
  ctx.fill();
  // Palm tree trunk
  ctx.strokeStyle = '#8B6914';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(5, 5);
  ctx.quadraticCurveTo(8, -10, 6, -20);
  ctx.stroke();
  // Palm leaves
  ctx.fillStyle = '#2a7a2a';
  for (let a = 0; a < 5; a++) {
    ctx.save();
    ctx.translate(6, -20);
    ctx.rotate(a * 1.2 - 2.4);
    ctx.beginPath();
    ctx.ellipse(8, 0, 10, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawBuoy(o) {
  // Pole
  ctx.fillStyle = '#888';
  ctx.fillRect(-2, -o.h/2, 4, o.h);
  // Top ball
  ctx.fillStyle = '#ff4444';
  ctx.beginPath();
  ctx.arc(0, -o.h/2, 8, 0, Math.PI * 2);
  ctx.fill();
  // White stripe
  ctx.fillStyle = '#fff';
  ctx.fillRect(-8, -o.h/2 - 2, 16, 4);
  // Base
  ctx.fillStyle = '#666';
  ctx.beginPath();
  ctx.ellipse(0, o.h/2, 10, 5, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawLog(o) {
  ctx.fillStyle = '#8B6914';
  ctx.beginPath();
  ctx.roundRect(-o.w/2, -o.h/2, o.w, o.h, 6);
  ctx.fill();
  // Bark lines
  ctx.strokeStyle = '#6a5010';
  ctx.lineWidth = 1;
  for (let i = -o.w/3; i < o.w/3; i += 8) {
    ctx.beginPath();
    ctx.moveTo(i, -o.h/2 + 2);
    ctx.lineTo(i, o.h/2 - 2);
    ctx.stroke();
  }
  // End circle
  ctx.fillStyle = '#c49a3a';
  ctx.beginPath();
  ctx.ellipse(-o.w/2, 0, 4, o.h/2 - 1, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawIceberg(o) {
  // Shadow in water
  ctx.fillStyle = 'rgba(100,200,255,0.15)';
  ctx.beginPath();
  ctx.ellipse(0, 8, o.w/2 + 5, o.h/3, 0, 0, Math.PI * 2);
  ctx.fill();
  // Main body
  ctx.fillStyle = '#c8e8ff';
  ctx.beginPath();
  ctx.moveTo(-o.w/2, 10);
  ctx.lineTo(-o.w/3, -o.h/2);
  ctx.lineTo(5, -o.h/2 - 5);
  ctx.lineTo(o.w/2, 5);
  ctx.lineTo(o.w/4, o.h/3);
  ctx.lineTo(-o.w/3, o.h/3);
  ctx.closePath();
  ctx.fill();
  // Highlight
  ctx.fillStyle = '#e8f8ff';
  ctx.beginPath();
  ctx.moveTo(-o.w/4, -o.h/3);
  ctx.lineTo(0, -o.h/2);
  ctx.lineTo(o.w/4, -o.h/4);
  ctx.lineTo(0, 0);
  ctx.closePath();
  ctx.fill();
}

// ============================================================
// DRAW COLLECTIBLE SHAPES
// ============================================================
function drawHeart(o) {
  ctx.fillStyle = o.color;
  ctx.beginPath();
  const s = o.w / 2;
  ctx.moveTo(0, s * 0.6);
  ctx.bezierCurveTo(-s, -s * 0.2, -s * 0.5, -s, 0, -s * 0.4);
  ctx.bezierCurveTo(s * 0.5, -s, s, -s * 0.2, 0, s * 0.6);
  ctx.fill();
}

function drawBolt(o) {
  ctx.fillStyle = o.color;
  ctx.beginPath();
  ctx.moveTo(2, -o.h/2);
  ctx.lineTo(-6, 2);
  ctx.lineTo(-1, 2);
  ctx.lineTo(-3, o.h/2);
  ctx.lineTo(7, -2);
  ctx.lineTo(2, -2);
  ctx.closePath();
  ctx.fill();
}

function drawShield(o) {
  ctx.fillStyle = o.color;
  ctx.beginPath();
  ctx.moveTo(0, -o.h/2);
  ctx.lineTo(o.w/2, -o.h/4);
  ctx.lineTo(o.w/2, o.h/6);
  ctx.lineTo(0, o.h/2);
  ctx.lineTo(-o.w/2, o.h/6);
  ctx.lineTo(-o.w/2, -o.h/4);
  ctx.closePath();
  ctx.fill();
  // Inner detail
  ctx.fillStyle = '#fff';
  ctx.globalAlpha = 0.3;
  ctx.beginPath();
  ctx.moveTo(0, -o.h/3);
  ctx.lineTo(o.w/4, -o.h/6);
  ctx.lineTo(0, o.h/4);
  ctx.lineTo(-o.w/4, -o.h/6);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawStar(o) {
  ctx.fillStyle = o.color;
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const angle = (i * 4 * Math.PI / 5) - Math.PI / 2;
    const r = o.w / 2;
    const x = Math.cos(angle) * r;
    const y = Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();
}

// ============================================================
// HUD
// ============================================================
function drawHUD() {
  // Score
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 28px Segoe UI, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(game.score, W / 2, 40);
  
  // Lives (hearts)
  for (let i = 0; i < game.lives; i++) {
    ctx.save();
    ctx.translate(20 + i * 28, 30);
    ctx.fillStyle = '#ff4466';
    ctx.beginPath();
    const s = 8;
    ctx.moveTo(0, s * 0.6);
    ctx.bezierCurveTo(-s, -s * 0.2, -s * 0.5, -s, 0, -s * 0.4);
    ctx.bezierCurveTo(s * 0.5, -s, s, -s * 0.2, 0, s * 0.6);
    ctx.fill();
    ctx.restore();
  }
  
  // Speed indicator
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = '12px Segoe UI, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('Speed: ' + game.speed.toFixed(1), W - 15, 30);
  
  // Active powerups
  let powerupY = 60;
  if (game.shielded) {
    ctx.fillStyle = '#00ccff';
    ctx.font = '12px Segoe UI, sans-serif';
    ctx.textAlign = 'right';
    const secs = Math.ceil(game.shieldTimer / 60);
    ctx.fillText('Shield: ' + secs + 's', W - 15, powerupY);
    powerupY += 18;
  }
  if (game.speedBoost > 0) {
    ctx.fillStyle = '#ffdd00';
    ctx.font = '12px Segoe UI, sans-serif';
    ctx.textAlign = 'right';
    const secs = Math.ceil(game.speedBoost / 60);
    ctx.fillText('Boost: ' + secs + 's', W - 15, powerupY);
  }
}

// ============================================================
// GAME LOOP
// ============================================================
function loop() {
  if (!game.running) return;
  update();
  draw();
  requestAnimationFrame(loop);
}

// ============================================================
// POLYFILL for roundRect
// ============================================================
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (typeof r === 'number') r = [r, r, r, r];
    this.moveTo(x + r[0], y);
    this.lineTo(x + w - r[1], y);
    this.quadraticCurveTo(x + w, y, x + w, y + r[1]);
    this.lineTo(x + w, y + h - r[2]);
    this.quadraticCurveTo(x + w, y + h, x + w - r[2], y + h);
    this.lineTo(x + r[3], y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - r[3]);
    this.lineTo(x, y + r[0]);
    this.quadraticCurveTo(x, y, x + r[0], y);
    this.closePath();
  };
}
